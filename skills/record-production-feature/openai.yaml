interface:
  display_name: Production Feature Media
  short_description: Reuse or record one verified feature as video and GIF
  default_prompt: >-
    Use $record-production-feature to deliver one verified feature as the requested
    MP4/GIF files. Begin with bounded package, source, access and dependency preflight.
    Inspect existing manifests/media first; use verified reuse for unchanged scope and
    exact SHA-bound QA, filling only missing gates. Keep production or explicitly requested
    preview/build provenance separate from current environment/live checks and local
    media tests. Preserve immutable originals and target native UI language. New takes
    require real UI discovery, rehearsal, fixed-time frame/timing verification before
    keep/discard, and take logs. For model-dependent media allow only live or strictly
    matched captured replay; scripted/mock/prefilled model output is prohibited. Preserve
    original evidence during reuse, identify current operations honestly, and visibly
    disclose replay. Verify every delivered file with full decode, actual MP4 1x playback
    to ended, actual frames, 16/9/7-pixel legibility defaults, at least 3 continuous readable
    result seconds and an independent cold reader. Default to persistent local/private
    delivery with a truthful handoff; public hosting, code publication and bot messages
    require explicit scope, and an already requested publication needs no redundant
    permission. Conditional stock/cutout work applies only when the selected story needs it.
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: false
