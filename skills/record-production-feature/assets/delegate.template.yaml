# Inbound request; YAML or compact text is sufficient. v1 also accepted.
# Required: one visible outcome and verifiable source identity.
# Source alternative: use source_evidence for an actual package/deployment/build
# instead of repo+commit/pr. Do not fabricate GitHub release or branch metadata.
schema: delegate_to_feature_recorder/v1.1
user_outcome: >-
  <One visible result, readable for at least 3 continuous seconds.>
repo: <owner/product-repo>
commit: <source-sha>
# branch: <source-branch>
# pr: <PR-number-or-URL>
# source_evidence: [<authorized-build-or-deployment-evidence>]
source_channel: production  # production | beta | preview | pr | working-alpha
# version: <actual-version>
# entry_url: <actual-target>
record_machine: auto        # auto | work | box (legacy Work alias) | mac_mini
delivery_target: local     # local | private | public
# delivery_destination: <explicit-persistent-target>
publication_requested: false
# publish_programs_repo: <explicitly-requested-programs-repository>
# reply_to: <optional-agent-id; not authorization to send>
# notify_authorization: <reference-to-explicit-message-instruction>
# existing_media: [<candidate-manifest-or-path>]
format: both               # gif | mp4 | both
# ui_language: <actual-native-target-language>
# constraints: []
# model_mode: live          # live | captured-replay; scripted/mock prohibited
# replay_source:            # verified original live evidence + actual project adapter
# model_budget:            # max_takes, max_live_requests, request_timeout_s, take_timeout_s
# fresh_live_required: false
# research_mode: auto       # auto | verified-reuse | standard | deep
